basePath: /
definitions:
  models.Message:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      receiver_id:
        type: string
      sender_id:
        type: string
    type: object
host: localhost:8081
info:
  contact: {}
  description: Chat Service
  title: VenueX Chat API
  version: "1.0"
paths:
  /messages:
    get:
      description: Get chat history between users
      parameters:
      - description: Sender ID
        in: query
        name: sender_id
        required: true
        type: string
      - description: Receiver ID
        in: query
        name: receiver_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Message'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get messages
      tags:
      - messages
  /ws:
    get:
      description: Real-time websocket chat connection
      parameters:
      - description: JWT token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: WebSocket chat
      tags:
      - chat
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

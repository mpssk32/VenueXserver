version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: concert_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: concert_platform
    ports:
      - "5432:5432"

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/concert_platform
      JWT_SECRET: super_secret_key
    depends_on:
      - postgres